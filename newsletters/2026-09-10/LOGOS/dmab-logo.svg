<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <!-- Background -->
  <rect width="220" height="80" rx="5" fill="#ffffff"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="220" height="5" rx="5" fill="#0f62fe"/>
  <!-- Blue icon block -->
  <rect x="12" y="14" width="52" height="52" rx="4" fill="#0f1c3a"/>
  <rect x="12" y="14" width="52" height="5" rx="2" fill="#0f62fe"/>
  <!-- DM text in block -->
  <text x="38" y="40" font-family="Arial Black,Arial,sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">DM</text>
  <text x="38" y="56" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#a8c8ff" text-anchor="middle" letter-spacing="1.5">BREVARD</text>
  <!-- Company name -->
  <text x="75" y="30" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#0f1c3a" letter-spacing="0.5">DATA MANAGEMENT</text>
  <text x="75" y="44" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#0f1c3a" letter-spacing="0.5">ASSOCIATES OF</text>
  <text x="75" y="58" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#0f62fe" letter-spacing="0.5">BREVARD, INC.</text>
  <!-- IBM Partner badge -->
  <rect x="75" y="63" width="120" height="12" rx="2" fill="#f4f6f9" stroke="#dde1e9" stroke-width="0.5"/>
  <text x="135" y="72" font-family="Arial,sans-serif" font-size="7" font-weight="600" fill="#525252" text-anchor="middle" letter-spacing="0.3">IBM BUSINESS PARTNER · MAINFRAME</text>
</svg>
