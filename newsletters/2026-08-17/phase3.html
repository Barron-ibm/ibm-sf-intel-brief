<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SE Horizon | My Accounts | Phase 3 | Aug 17, 2026 | Edition 05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5; --card:#ffffff; --surface:#f4f6f9; --border:#dde1e9;
  --text:#161616; --muted:#525252; --accent:#0f62fe; --accent-dk:#0043ce;
  --navy:#0f1c3a; --green:#006e2e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'IBM Plex Sans',-apple-system,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text);}
a{text-decoration:none;}

/* TOPBAR */
.se-topbar{background:#1a1a1a;border-bottom:3px solid var(--accent);padding:0 24px;height:46px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.se-topbar-left{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.se-topbar-ibm{font-size:18px;font-weight:900;color:#fff;letter-spacing:-0.5px;}
.se-topbar-div{width:1px;height:16px;background:#3a3a3a;}
.se-topbar-title{font-size:12px;font-weight:600;color:#a8c8ff;}
.se-topbar-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:2px 9px;border-radius:20px;}
.se-topbar-mid{display:flex;align-items:center;gap:2px;flex:1;justify-content:center;}
.se-topbar-mid a{font-size:11px;font-weight:600;color:rgba(255,255,255,0.5);padding:5px 10px;border-radius:3px;border-bottom:2px solid transparent;}
.se-topbar-mid a:hover{color:#fff;background:rgba(255,255,255,0.07);}
.se-topbar-mid a.active{color:#fff;border-bottom-color:var(--accent);}
.se-topbar-mid a.back{color:#a8c8ff;font-size:10.5px;}
.se-topbar-mid .div{color:#3a3a3a;padding:0 4px;font-size:11px;}
.se-topbar-right{font-size:10px;color:#5a5a5a;flex-shrink:0;}

/* MOCK BANNER */
.mock-banner{background:#1c0f30;border-bottom:2px solid #6929c4;padding:7px 24px;display:flex;align-items:center;gap:10px;}
.mock-banner-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#d4bbff;background:#6929c4;padding:3px 9px;border-radius:2px;}
.mock-banner-txt{font-size:11px;color:#9e80cc;}

/* SHELL */
.p3-shell{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 79px);overflow:hidden;}

/* RAIL */
.rail{background:var(--navy);overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.08);}
.rail-hdr{padding:12px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;background:var(--navy);z-index:10;}
.rail-title{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#4a6080;margin-bottom:8px;}
.filter-zone-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#2d4a6a;margin-bottom:5px;}
.filter-zone-sep{height:1px;background:rgba(255,255,255,0.06);margin:8px 0;}
.filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px;}
.fp{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);background:transparent;transition:all .12s;}
.fp:hover{border-color:rgba(255,255,255,0.35);color:rgba(255,255,255,0.85);}
.fp.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.fp.dai{border-color:rgba(168,200,255,.25);color:#a8c8ff;}
.fp.dai.on{background:#001d6c;border-color:#a8c8ff;}
.fp.auto{border-color:rgba(212,187,255,.25);color:#d4bbff;}
.fp.auto.on{background:#1c0f30;border-color:#d4bbff;}
.fp.stor{border-color:rgba(111,220,140,.25);color:#6fdc8c;}
.fp.stor.on{background:#061a0e;border-color:#6fdc8c;}
.fp.pc{border-color:rgba(212,160,23,.25);color:#d4a017;}
.fp.pc.on{background:#1c1500;border-color:#d4a017;}

/* CLUSTER */
.cluster{margin-top:2px;}
.cluster-hdr{padding:9px 16px 5px;display:flex;justify-content:space-between;align-items:center;}
.cluster-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#2d4a6a;}
.cluster-ct{font-family:'IBM Plex Mono',monospace;font-size:8px;color:#2d4a6a;}
.cluster-strike .cluster-lbl{color:#7f3030;}
.cluster-engage .cluster-lbl{color:#6b4010;}
.cluster-standby .cluster-lbl{color:#1e3a5a;}
.rail-body{flex:1;padding-bottom:16px;}

/* RAIL ACCOUNT CARD */
.ra{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background .12s;border-left:3px solid transparent;}
.ra:hover{background:rgba(255,255,255,0.04);}
.ra.on{background:rgba(15,98,254,0.15);border-left-color:var(--accent);}
.ra.on .ra-name{color:#fff;}
.ra-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:3px;}
.ra-name{font-size:11.5px;font-weight:700;color:#c8d8ea;line-height:1.2;}
.ra-urg{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap;flex-shrink:0;}
.u-strike{background:#7f1d1d;color:#fca5a5;}
.u-engage{background:#431407;color:#fdba74;}
.u-standby{background:#0c1a2e;color:#93c5fd;}
.ra-hook{font-size:10px;color:#4a6a8a;line-height:1.4;font-style:italic;margin-bottom:4px;}
.ra-brands{display:flex;gap:3px;flex-wrap:wrap;}
.rb{font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;padding:2px 6px;border-radius:2px;}
.rb-dai{background:#001d6c;color:#a8c8ff;}
.rb-auto{background:#1c0f30;color:#d4bbff;}
.rb-stor{background:#061a0e;color:#6fdc8c;}
.rb-pc{background:#1c1500;color:#d4a017;}

/* DETAIL */
.detail{background:var(--bg);overflow-y:auto;}
.detail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;font-style:italic;}

/* ACCOUNT HEADER */
.acct-hdr{background:var(--card);border-bottom:3px solid var(--accent);padding:20px 28px;}
.acct-hdr-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:10px;}
.acct-ticker{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:8px 14px;flex-shrink:0;min-width:64px;text-align:center;}
.acct-logo-cell{flex-shrink:0;width:100px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:6px 10px;overflow:hidden;}
.acct-logo-cell img{max-width:88px;max-height:48px;object-fit:contain;mix-blend-mode:multiply;}
.acct-title{flex:1;}
.acct-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#6b8cb8;margin-bottom:3px;}
.acct-name{font-size:22px;font-weight:900;color:var(--navy);line-height:1.1;letter-spacing:-0.3px;}
.acct-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.acct-hdr-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.acct-urg{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:3px;}
.acct-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:3px 9px;border-radius:3px;}
.acct-thesis{font-size:12.5px;color:var(--muted);line-height:1.7;padding-top:12px;border-top:1px solid var(--border);}
.acct-thesis strong{color:var(--text);font-weight:600;}
.acct-thesis .thesis-angle{display:block;margin-top:8px;font-size:11.5px;color:#1e3a6a;background:#edf3ff;border-left:3px solid var(--accent);padding:7px 10px;border-radius:2px;line-height:1.6;font-style:normal;}
.acct-vitals{display:flex;gap:0;margin-top:12px;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.vital{flex:1;padding:8px 12px;border-right:1px solid var(--border);background:var(--surface);}
.vital:last-child{border-right:none;}
.vital-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.vital-val{font-size:12px;font-weight:700;color:var(--text);line-height:1.3;}
.vital-sub{font-size:10px;color:var(--muted);margin-top:1px;}

/* SECTION HEADER */
.detail-body{padding:0 28px 36px;}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px;}
.sec-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.sec-line{flex:1;height:1px;background:var(--border);}

/* HEAT SCORES */
.heat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.heat-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--hc,var(--border));border-radius:5px;padding:12px 14px;}
.heat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.heat-play{font-size:11.5px;font-weight:700;color:var(--text);line-height:1.3;}
.heat-score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.heat-score{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;line-height:1;color:var(--hc,var(--muted));}
.heat-rating{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--hc,var(--muted));}
.heat-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:6px;}
.heat-fill{height:100%;border-radius:2px;background:var(--hc,var(--accent));width:var(--pct,50%);}
.heat-deal{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:6px;}
.heat-conviction{font-size:10.5px;color:#2d3f5a;line-height:1.5;border-top:1px solid var(--border);padding-top:6px;margin-top:2px;}

/* COMPETITIVE THREATS */
.threats{display:flex;flex-direction:column;gap:10px;}
.threat{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--tc2,#7f1d1d);border-radius:4px;padding:12px 14px;}
.threat-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.threat-name{font-size:13px;font-weight:800;color:var(--text);}
.threat-level{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:2px;flex-shrink:0;}
.tl-active{background:#7f1d1d;color:#fca5a5;}
.tl-monitor{background:#1c1500;color:#d4a017;}
.tl-emerging{background:#0c1a2e;color:#93c5fd;}
.threat-doing{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:7px;}
.threat-doing-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px;}
.threat-counter{font-size:11px;color:#166534;background:#dcfce7;border-left:3px solid #166534;padding:6px 10px;border-radius:2px;line-height:1.5;}
.threat-counter-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#166534;display:block;margin-bottom:2px;}

/* WHY IBM WINS */
.win-list{display:flex;flex-direction:column;gap:8px;}
.win-item{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;}
.win-num{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;color:var(--accent);line-height:1;flex-shrink:0;min-width:24px;}
.win-body{}
.win-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3;}
.win-why{font-size:11px;color:var(--muted);line-height:1.5;}

/* OBJECTION HANDLER */
.obj-list{display:flex;flex-direction:column;gap:10px;}
.obj-card{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.obj-q{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
.obj-q-icon{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:#1c1500;color:#d4a017;white-space:nowrap;flex-shrink:0;margin-top:1px;}
.obj-q-text{font-size:12px;font-weight:700;color:var(--text);line-height:1.4;font-style:italic;}
.obj-a{padding:8px 14px 10px;background:var(--surface);}
.obj-a-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px;}
.obj-a-text{font-size:11px;color:#2d3f5a;line-height:1.5;margin-bottom:6px;}
.obj-kill{font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-left:3px solid var(--accent);padding:5px 10px;border-radius:2px;line-height:1.4;}
.obj-kill-lbl{font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#a8c8ff;display:block;margin-bottom:2px;}

/* SIGNALS */
.signals{display:flex;flex-direction:column;gap:10px;}
.signal{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--sc,var(--border));border-radius:4px;padding:12px 14px;}
.signal-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.signal-type{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:2px;color:#fff;background:var(--sc,var(--muted));white-space:nowrap;flex-shrink:0;}
.signal-ts{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:0.3px;color:var(--muted);}
.signal-head{font-size:12px;font-weight:700;color:var(--text);margin-bottom:5px;line-height:1.3;}
.signal-body{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:7px;}
.signal-angle{font-size:11px;color:#1e3a6a;background:#edf3ff;border-left:3px solid var(--accent);padding:6px 10px;border-radius:2px;line-height:1.5;}
.signal-angle strong{font-weight:700;color:var(--accent);}

/* WHO TO CALL */
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.person{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--pc,var(--border));border-radius:4px;padding:12px 14px;}
.person-tag{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--pc,var(--muted));margin-bottom:5px;}
.person-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:1px;}
.person-title{font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.4;}
.person-approach{font-size:10.5px;color:#2d3f5a;font-style:italic;line-height:1.4;border-left:2px solid var(--border);padding-left:8px;margin-bottom:8px;}
.person-opener{font-size:10.5px;color:#1e3a6a;background:#edf3ff;border-left:2px solid var(--accent);padding:5px 8px;border-radius:2px;line-height:1.4;margin-bottom:7px;}
.person-opener-lbl{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px;}

/* THIS WEEK'S MOVE */
.move{background:var(--navy);border-radius:5px;padding:16px 20px;margin-top:4px;}
.move-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
.move-row:last-child{margin-bottom:0;}
.move-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--accent);padding:5px 0;min-width:100px;width:100px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.move-lbl-warn{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:#7f1d1d;padding:5px 0;min-width:100px;width:100px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.move-track-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);padding:5px 0;min-width:100px;width:100px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.move-text{font-size:12px;color:#c8d8ea;line-height:1.6;}
.move-track-text{font-size:12px;color:#8a9ab8;font-style:italic;line-height:1.6;border-left:3px solid var(--accent);padding-left:10px;}
.move-warn-text{font-size:12px;color:#fca5a5;line-height:1.6;border-left:3px solid #7f1d1d;padding-left:10px;}

/* BRIEF LINK */
/* ACTION SEQUENCE */
.aseq{display:flex;flex-direction:column;gap:0;}
.aseq-gate{background:#0f1c3a;border:1px solid rgba(168,200,255,0.12);border-left:4px solid var(--accent);border-radius:4px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;}
.aseq-gate-icon{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#a8c8ff;background:var(--accent);padding:3px 8px;border-radius:2px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.aseq-gate-body{flex:1;}
.aseq-gate-text{font-size:11.5px;color:#c8d8ea;line-height:1.5;font-weight:600;}
.aseq-gate-sub{font-size:10px;color:#6b8cb8;line-height:1.4;margin-top:3px;}
.aseq-step{background:var(--card);border:1px solid var(--border);border-radius:4px;margin-bottom:6px;overflow:hidden;display:flex;}
.aseq-num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);background:var(--surface);border-right:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;justify-content:center;min-width:52px;flex-shrink:0;line-height:1;}
.aseq-body{flex:1;padding:11px 14px;}
.aseq-who{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.aseq-action{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:4px;}
.aseq-why{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:7px;}
.aseq-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.aseq-tag{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:2px;white-space:nowrap;}
.as-now{background:#7f1d1d;color:#fca5a5;}
.as-week{background:#431407;color:#fdba74;}
.as-month{background:#0c1a2e;color:#93c5fd;}
.as-depend{background:#1a2535;color:#6b8cb8;border:1px solid rgba(107,140,184,0.2);}
.aseq-dep{font-size:10px;color:#4a6a8a;font-style:italic;}
.aseq-killrisk{background:#0f1c3a;border:1px solid rgba(124,58,237,0.35);border-left:4px solid #7c3aed;border-radius:4px;padding:12px 14px;margin-top:8px;}
.aseq-killrisk-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#d4bbff;background:#6929c4;padding:3px 8px;border-radius:2px;display:inline-block;margin-bottom:8px;}
.aseq-kill-head{font-size:12px;font-weight:700;color:#e9d5ff;margin-bottom:4px;line-height:1.3;}
